# Production:  docker compose up --build -d      -> http://localhost:8080
# Development: docker compose --profile dev up dev -> http://localhost:3500 (live reload; or just `npm run dev`)
services:
  web:
    build: .
    image: buen-website
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    profiles: [dev]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "3500:3500"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
