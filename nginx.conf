server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off; # /joannes -> /joannes/ keeps the host and port the visitor used

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # /joannes -> joannes/index.html (profile pages); anything else unknown -> the 404 page
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # Next.js fingerprints everything in /_next/static, so it can be cached for good.
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~* \.(png|jpe?g|webp|svg|woff2?|ttf)$ { add_header Cache-Control "public, max-age=604800"; }
}
