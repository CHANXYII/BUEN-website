<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judge scoring | BU Engineering</title>
  <link rel="stylesheet" href="judge.css?v=2">
</head>
<body>
<main class="card">
  <p class="eyebrow">BU Engineering</p>
  <h1>Judge scoring</h1>
  <p id="status" class="status">Sign in to enter scores for your assigned workshop.</p>
  <section id="login">
    <input id="email" type="email" placeholder="Judge email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="judge.js" defer></script>
</body>
</html>
