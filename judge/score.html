<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Judge scoring | BU Engineering</title><link rel="stylesheet" href="judge.css"></head><body><header class="site-header"><span class="brand">BU ENGINEERING</span><span class="header-label">JUDGE PORTAL</span></header><main class="page-shell"><div class="page-heading"><div><p class="eyebrow">Workshop review</p><h1>All participants</h1><p id="status" class="status">Select a workshop and participant to enter a score.</p></div><button id="signout" class="secondary">Sign out</button></div><label class="page-workshop">Workshop<select id="pageWorkshopSelect"><option value="w1">Workshop 1</option><option value="w2">Workshop 2</option><option value="w3">Workshop 3</option><option value="w4">Workshop 4</option></select></label><section id="participants" class="participant-grid" aria-label="Participants"></section></main><div id="scoreModal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button id="closeModal" class="modal-close" aria-label="Close">×</button><p class="eyebrow">Participant review</p><h2 id="scoreTitle"></h2><p id="scoreMeta" class="muted"></p><p id="selectedWorkshop" class="selected-workshop"></p><div class="category-grid"><label>Topic 1 <span class="field-limit">/5</span><input class="topic-score" data-topic="topic_1" type="number" min="0" max="5" step="0.5" required></label><label>Topic 2 <span class="field-limit">/5</span><input class="topic-score" data-topic="topic_2" type="number" min="0" max="5" step="0.5" required></label><label>Topic 3 <span class="field-limit">/5</span><input class="topic-score" data-topic="topic_3" type="number" min="0" max="5" step="0.5" required></label><label>Topic 4 <span class="field-limit">/5</span><input class="topic-score" data-topic="topic_4" type="number" min="0" max="5" step="0.5" required></label><label>Topic 5 <span class="field-limit">/5</span><input class="topic-score" data-topic="topic_5" type="number" min="0" max="5" step="0.5" required></label></div><p class="total-score">Weekly total: <strong id="totalScore">0</strong> / 25</p><label>Comment<textarea id="commentInput" rows="4" placeholder="Add an optional comment"></textarea></label><button id="saveScore">Save score</button></div></div><script src="judge.js" defer></script></body></html>
