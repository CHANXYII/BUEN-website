<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Judge scoring | BU Engineering</title><link rel="stylesheet" href="judge.css"></head><body><header class="site-header"><span class="brand">BU ENGINEERING</span><span class="header-label">JUDGE PORTAL</span></header><main class="page-shell"><div class="page-heading"><div><p class="eyebrow">Workshop review</p><h1>All participants</h1><p id="status" class="status">Select a participant to enter a score.</p></div><button id="signout" class="secondary">Sign out</button></div><section id="participants" class="participant-grid" aria-label="Participants"></section></main><div id="scoreModal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button id="closeModal" class="modal-close" aria-label="Close">×</button><p class="eyebrow">Participant review</p><h2 id="scoreTitle"></h2><p id="scoreMeta" class="muted"></p><label>Workshop<select id="workshopSelect"></select></label><div class="category-grid"><label>Behavior and Professionalism<span class="field-limit">/25</span><input class="category-score" data-category="behavior" type="number" min="0" max="25" step="0.5" required></label><label>Participation and Teamwork<span class="field-limit">/25</span><input class="category-score" data-category="participation" type="number" min="0" max="25" step="0.5" required></label><label>Technical Understanding<span class="field-limit">/25</span><input class="category-score" data-category="technical" type="number" min="0" max="25" step="0.5" required></label><label>Creativity and Initiative<span class="field-limit">/25</span><input class="category-score" data-category="creativity" type="number" min="0" max="25" step="0.5" required></label></div><p class="total-score">Total score: <strong id="totalScore">0</strong> / 100</p><label>Comment<textarea id="commentInput" rows="4" placeholder="Add an optional comment"></textarea></label><button id="saveScore">Save score</button></div></div><script src="judge.js" defer></script></body></html>
