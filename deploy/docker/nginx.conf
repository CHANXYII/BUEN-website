server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # styles.css / app.js are not fingerprinted, so keep their cache short.
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=300"; }
  location ~* \.(png|jpe?g|webp|svg|woff2?|ttf)$ { add_header Cache-Control "public, max-age=604800"; }
}
