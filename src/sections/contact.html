<section class="contact reveal" id="contact">
  <div class="wrap two">
    <div>
      <h2>Contact</h2>
      <!-- TODO: full address and real email -->
      <p><span>School of Engineering, Bangkok University</span><br><span>Thailand</span></p>
      <p><a href="mailto:engineering@example.com">engineering@example.com</a></p>
    </div>
    <form action="mailto:engineering@example.com" method="post" enctype="text/plain">
      <label><span>Name</span> <input name="name" required></label>
      <label><span>Email</span> <input name="email" type="email" required></label>
      <label><span>Message</span> <textarea name="message" rows="4" required></textarea></label>
      <button class="btn primary">Send</button>
    </form>
  </div>
</section>
